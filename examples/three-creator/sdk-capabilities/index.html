<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Three SDK · Play Lab</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#ecf6ef;background:#9ac9d4}*{box-sizing:border-box}body{margin:0;overflow:hidden}canvas{display:block;width:100vw;height:100vh;outline:none}.panel{position:fixed;top:22px;left:22px;width:290px;padding:18px;max-height:calc(100vh - 44px);overflow:auto;scrollbar-width:thin;background:#12312ae8;border:1px solid #ffffff24;border-radius:18px;box-shadow:0 10px 40px #05231a33;backdrop-filter:blur(16px)}.eyebrow{color:#b4d6c1;font-size:10px;letter-spacing:2.4px;font-weight:700}h1{font-size:26px;letter-spacing:-1px;margin:6px 0 8px}p{font-size:12px;line-height:1.65;margin:0 0 13px;color:#cce1d2}.row{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:7px 0}button{border:1px solid #a2c7b344;border-radius:8px;background:#23483c;color:#edf7f1;padding:9px 7px;cursor:pointer;font:inherit;font-size:11px}button:hover{background:#366450}button:focus-visible{outline:2px solid #f8b777;outline-offset:2px}.primary{background:#eab17a;color:#263c2f;font-weight:700;border:none}.primary:hover{background:#ffc28a}.divider{height:1px;background:#b8dbbd22;margin:13px 0}.label{font-size:10px;color:#9fc2ae;letter-spacing:1px;text-transform:uppercase}.status{font:11px/1.5 ui-monospace,monospace;color:#d6eadc;min-height:38px;margin-top:12px;overflow-wrap:anywhere}.hint{position:fixed;bottom:18px;left:335px;right:22px;background:#14372bde;border:1px solid #c9e7d133;border-radius:100px;padding:11px 22px;font-size:11px;text-align:center;white-space:normal;box-shadow:0 8px 20px #12332620}.badge{position:fixed;right:24px;top:24px;font-size:10px;letter-spacing:1.5px;color:#264533;background:#eff9e8db;padding:9px 13px;border-radius:100px}#loading{position:fixed;inset:0;display:grid;place-items:center;background:#163e32;color:#d9eadf;z-index:5;font-size:16px}#loading[hidden]{display:none}@media(max-width:760px){.panel{width:225px;padding:14px;top:12px;left:12px}.badge{display:none}.hint{font-size:10px;padding:10px 12px;left:252px;right:12px}h1{font-size:22px}p{font-size:11px}}
  </style>
</head>
<body>
  <div id="loading" role="status">正在装载 G Bot 与物理世界…</div>
  <aside class="panel" aria-label="能力场景控制">
    <div class="eyebrow">WORLDKIT / THREE SDK</div><h1>Play Lab</h1>
    <p>走上阶梯和斜坡，靠近信标按 E。橙色伙伴由自由 Three 几何组成，尾巴随运动摆动。</p>
    <div class="row"><button id="play" class="primary">开始游玩</button><button id="reset">重置场景</button></div>
    <div class="divider"></div><div class="label">世界控制</div>
    <div class="row"><button id="interact">信标交互 · E</button><button id="visibility">隐藏 / 显示信标</button></div>
    <div class="row"><button id="resize">缩放试验柱</button><button id="spawn">生成物理木箱</button></div>
    <div class="row"><button id="despawn">移除生成木箱</button><button id="action">G Bot 跳舞</button></div>
    <div class="divider"></div><div class="label">NPC · 橙色伙伴</div>
    <div class="row"><button id="move">前往远端圆环</button><button id="follow">跟随 G Bot</button></div>
    <div class="row"><button id="stop">停止行动</button><button id="overview">总览 / 跟随</button></div>
    <div class="row"><button id="resume">恢复自主巡逻</button><button id="sky">白天 / 极光天空</button></div>
    <div class="divider"></div><div class="label">运动与几何</div>
    <p>悬浮由玩家控制，按住 Space 上升、松开下降；不提供空中自动寻路。</p>
    <div class="row"><button id="flight">切换悬浮</button><button id="ground">回到地面模式</button></div>
    <div class="row"><button id="bridge-long">延长桥梁</button><button id="bridge-short">恢复短桥</button></div>
    <div id="status" class="status" aria-live="polite">准备中</div>
  </aside>
  <div class="badge">CAPABILITY FIXTURE · EXPERIMENTAL</div>
  <div class="hint">WASD 移动　方向键 / 拖动转镜头　Shift 跑步　Space 跳跃 / 悬浮升高　R 重置</div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
