<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>飞行生物 · 飞龙试飞</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#09121a;color:#eef6fa;font:15px/1.6 system-ui}canvas{width:100vw;height:100vh;display:block;outline:none;touch-action:none}.panel{position:fixed;background:#101d29e8;border:1px solid #ffffff24;border-radius:14px;backdrop-filter:blur(12px);padding:18px 22px;max-width:420px}header{top:22px;left:24px}h1{font-size:23px;letter-spacing:2px;margin:0 0 6px}.label{color:#8bd9d5;font-size:12px;letter-spacing:3px}.muted{color:#b1bec8;font-size:13px}footer{bottom:22px;left:24px}aside{right:24px;top:22px;width:270px}button{border:1px solid #83d9d866;background:#235659;color:white;border-radius:7px;padding:7px 12px;cursor:pointer;margin-right:6px}progress{width:100%;height:12px;accent-color:#7bd6cd}#speed{font-size:30px;font-variant-numeric:tabular-nums}#error{color:#ffb49f;white-space:pre-wrap}label{display:block;margin-top:9px}input{width:100%;accent-color:#7bd6cd}#loading{position:fixed;top:46%;width:100%;text-align:center;font-size:20px;pointer-events:none}kbd{background:#ffffff15;padding:1px 5px;border-radius:4px}.flash{color:#ffd195}
</style>  <script type="module" crossorigin src="/flying-creature/assets/flying-creature-DuOXWQHR.js"></script>
</head><body>
<canvas id="flight-canvas" tabindex="0"></canvas>
<header class="panel"><div class="label">FLYING CREATURE · D01 / H01</div><h1>飞龙试飞</h1><div class="muted">飞行生物大类 · 已骑乘飞行开发版</div><div id="error"></div></header>
<aside class="panel"><div><span id="speed">0</span> <span class="muted">m/s</span></div><div id="mode">正在准备</div><div class="muted">体力</div><progress id="stamina" max="1" value="1"></progress><div id="telemetry" class="muted"></div><label>巡航速度 <input id="cruise" type="range" min="10" max="27" step="1" value="18"></label><label>转向响应 <input id="turn" type="range" min="0.5" max="2.5" step="0.1" value="1.4"></label><p><button id="reset">重新试飞</button><button id="pause">暂停</button></p><div class="muted">本地资产试玩；主动作展示动画与火焰，尚无伤害结算。</div></aside>
<footer class="panel"><div><kbd>W / S</kbd> 俯冲 / 抬头　<kbd>A / D</kbd> 转向</div><div><kbd>Shift</kbd> 加速　<kbd>Ctrl</kbd> 快速刹停　<kbd>Space</kbd> 按住滑翔</div><div><kbd>E</kbd> 按住喷火　<kbd>Q</kbd> 侧向闪避</div><div class="muted">左键拖动观察 · 滚轮缩放 · 方向键转镜头<br>松开方向键减速悬停 · 松 Ctrl 保持停留<br>T 第一／第三人称 · R 回正 · C 按住后视 · V 换肩</div></footer>
<div id="loading">正在装配龙、骑手和飞行动画…</div></body></html>
