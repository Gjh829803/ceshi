name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.3.0
          cache: pnpm

      - name: Cache Site npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-site-npm-${{ hashFiles('sites/world-sdk-blueprint/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-site-npm-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install media and Python test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check pillow requests

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Site dependencies
        run: npm ci --prefix sites/world-sdk-blueprint --no-audit --no-fund

      - name: Check generated Builder self-check
        run: pnpm check:agent-self-check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test Studio
        run: pnpm test:studio

      - name: Test independent Node, Python, and Site lanes
        run: pnpm test:independent

      - name: Run full Vitest suite
        run: pnpm test

      - name: Build Playground
        run: pnpm build

      - name: Assert checks left the tracked tree clean
        run: git diff --exit-code
