name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-validation

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Verify workspace boundaries and test census
        run: pnpm verify:workspace-boundaries && pnpm test:census

      - name: Test independent Node and Python lanes
        run: pnpm test:independent

      - name: Run contract tests
        run: pnpm test:contract

      - name: Build Three runtime
        run: pnpm build

      - name: Assert checks left the tracked tree clean
        run: git diff --exit-code

  resource-heavy:
    name: Resource-heavy tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-validation

      # Each runner retains the existing single-fork isolation and test limits.
      - name: Run resource-heavy test shard
        run: pnpm test:resource-heavy --shard=${{ matrix.shard }}/3

      - name: Assert tests left the tracked tree clean
        run: git diff --exit-code

  # Preserve the required check name and reject failed, cancelled or skipped lanes.
  validate:
    if: ${{ always() }}
    needs: [checks, resource-heavy]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every validation lane to succeed
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          RESOURCE_TESTS_RESULT: ${{ needs.resource-heavy.result }}
        run: |
          test "$CHECKS_RESULT" = success
          test "$RESOURCE_TESTS_RESULT" = success
