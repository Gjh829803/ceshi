<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Babylon Native scene reconstruction with SDK-owned gameplay"
    />
    <title>WorldKit · Babylon Native Package</title>
  </head>
  <body>
    <main id="app">
      <section class="viewport" data-viewport>
        <div class="loading" data-loading>
          <span class="loading-mark"></span>
          <strong>正在验证并加载 Native WorldPackage</strong>
          <small data-loading-stage>初始化 Babylon / Havok…</small>
        </div>
      </section>
      <aside class="brand-panel glass-panel">
        <span class="eyebrow">EXPERIMENTAL LANE</span>
        <strong>Native Package Harness</strong>
        <span>Babylon Native Visual · SDK Gameplay</span>
      </aside>
      <aside class="status-panel glass-panel" aria-live="polite">
        <div><span>FPS</span><strong data-fps>—</strong></div>
        <div><span>STATE</span><strong data-state>LOADING</strong></div>
        <div class="position-row"><span>POSITION</span><strong data-position>—</strong></div>
      </aside>
      <aside class="controls-panel glass-panel">
        <span class="panel-title">探索控制</span>
        <div class="control-row"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd><span>移动</span></div>
        <div class="control-row"><kbd>⇧</kbd><span>奔跑</span><kbd class="wide">SPACE</kbd><span>跳跃</span></div>
        <div class="control-row"><kbd>R</kbd><span>重置</span></div>
        <p>拖动鼠标旋转 · 滚轮缩放</p>
      </aside>
      <button class="pause-button glass-panel" type="button" data-pause aria-label="暂停">Ⅱ</button>
      <div class="error-panel" data-error hidden></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
