<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>载具调用与生命周期</title></head><body class="native-lab"><header><div><span class="eyebrow">WHITEBOX / VEHICLE LIFECYCLE</span><h1>载具调用与生命周期</h1><p>1 km × 1 km 综合训练园区 · 道路、坡道、深水区、起降跑道 · 按需创建，使用现有载具物理。</p></div><a href="/#/scenes/campus">打开完整编辑器</a></header><main><div id="viewport" class="viewport"></div><aside>
<section class="card"><h2>01 / 调用载具</h2><label for="vehicle-type">载具／坐骑型号</label><select id="vehicle-type" disabled></select><button id="vehicle-create" class="primary" disabled>创建并定位到载具旁</button><p id="catalog-state" class="hint"></p><label for="vehicle-instance">场景中已创建</label><select id="vehicle-instance" disabled></select><div class="actions"><button id="locate" disabled>定位到选中载具</button><button id="enter" disabled>上车／骑乘</button><button id="exit" disabled>下车</button></div><button id="summon" hidden disabled>召唤选中飞龙落地</button><p id="dragon-state" class="hint" hidden></p><p id="control-hint" class="hint"></p></section>
<section class="card"><h2>02 / 选中载具的生命周期</h2><div class="actions"><button id="pause" disabled>停用选中载具</button><button id="resume" disabled>恢复选中载具</button></div><div class="actions"><button id="car-destroy" disabled>安全下车并销毁</button><button id="car-create" disabled>重新创建选中型号</button></div><p id="group-state" class="hint"></p><p id="message" role="status">正在准备园区和人物…</p></section>
<section class="card"><h2>03 / 对照人物</h2><div class="actions"><button id="peer-pause" disabled>停用对照人物</button><button id="peer-resume" disabled>恢复对照人物</button></div><div class="actions"><button id="peer-destroy" disabled>销毁对照人物</button><button id="peer-create" disabled>创建对照人物</button></div><p id="peer-state" class="hint"></p></section>
<section class="card"><h2>04 / 世界</h2><div class="actions"><button id="reset" disabled>重置测试世界</button><button id="destroy" disabled>销毁测试世界</button></div><p id="world-state" class="hint"></p><p class="hint">骑乘时人物与载具一起停用、恢复。销毁先安全下车；重置会移除后创建的实例。已销毁对象不会复活。</p></section>
</aside></main><script type="module" src="/src/asset-lifecycle/native.ts"></script></body></html>
