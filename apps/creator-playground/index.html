<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Creator · Playable world preview</title>
  </head>
  <body>
    <main id="app">
      <canvas data-canvas tabindex="0" aria-label="可玩世界"></canvas>
      <div class="loading" data-loading role="status">正在启动世界…</div>
      <aside class="controls">
        <div class="title"><span data-scene-name>Creator</span><small>实验预览</small></div>
        <div class="buttons">
          <button type="button" data-play disabled>开始探索</button>
          <button type="button" data-reset disabled>重新开始</button>
        </div>
        <p>WASD 移动 · Shift 奔跑 · 空格跳跃<br />拖动旋转视角 · 滚轮缩放 · R 重置</p>
        <output data-status>载入中</output>
      </aside>
      <pre class="error" data-error hidden role="alert"></pre>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
